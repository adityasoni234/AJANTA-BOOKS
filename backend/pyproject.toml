[project]
name = "ajanta-books-erp"
version = "1.0.0"
description = "Multi-outlet bookstore CRM + ERP backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008", "S101", "S105", "S106", "E501", "UP042", "UP046", "B904", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"app/models/__init__.py" = ["F401"]
"app/seed.py" = ["S311", "S608", "S112"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]
