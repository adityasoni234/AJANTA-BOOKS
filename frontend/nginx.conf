# Serves the SPA and reverse-proxies /api to the backend on the same origin, so session
# cookies stay first-party (SameSite=Lax) and no CORS is needed.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;
  server_tokens off;

  # nginx drops inherited add_header directives when a location sets its own, so every
  # location below includes the same security headers.
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; return 200 "ok"; }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }

  location /health/ { proxy_pass http://backend:8000; }

  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
